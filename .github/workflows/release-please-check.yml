name: release-please-check

# build-check.yml can't run on release-please's own PRs: a `pull_request`
# event created via GITHUB_TOKEN never triggers other workflows (GitHub's
# anti-recursion rule), so that required check would stay stuck forever and
# block the release PR. workflow_run isn't subject to that restriction (it's
# fired by the platform on run completion, not by the token that ran it), so
# we chain off release-please's own run and post the "build" status
# ourselves.
#
# Note: github.event.workflow_run.head_sha is the commit that triggered
# release-please (on main), NOT release-please's own generated branch/PR —
# we have to look that PR up separately to get its real head SHA.

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find the release-please PR's head SHA
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh pr list --repo "${{ github.repository }}" --base main --json headRefName,headRefOid \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefOid // empty')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.find_pr.outputs.sha != ''
        with:
          ref: ${{ steps.find_pr.outputs.sha }}

      - uses: actions/setup-node@v4
        if: steps.find_pr.outputs.sha != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.find_pr.outputs.sha != ''
      - run: npm run build
        if: steps.find_pr.outputs.sha != ''

      - name: Report build status
        if: always() && steps.find_pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="failure"
          if [ "${{ job.status }}" = "success" ]; then state="success"; fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.find_pr.outputs.sha }}" \
            -f state="$state" \
            -f context="build" \
            -f description="Build check (via release-please-check)"
