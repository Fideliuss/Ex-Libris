<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eae1cb" />
    <script>
      // Pose data-theme avant le premier rendu pour éviter un flash du
      // mauvais thème (le hook React ne s'applique qu'après hydratation).
      // Copie minimale de la logique de useTheme.js — les deux doivent
      // rester cohérentes si le stockage ou la palette changent.
      (function () {
        try {
          var pref = localStorage.getItem('theme-preference')
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.dataset.theme = pref
          }
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#161310' : '#eae1cb')
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Ex Libris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
